<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud E-Commerce Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product h3 {
            margin-top: 0;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #cart {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cloud E-Commerce Platform</h1>
        <p>Simple Online Shopping Platform</p>
    </header>

    <div class="container">

        <h2>Products</h2>

        <div class="products">

            <div class="product">
                <h3>Laptop</h3>
                <p>Price: ₹55,000</p>
                <button onclick="addToCart(1, 'Laptop', 1)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>Smartphone</h3>
                <p>Price: ₹25,000</p>
                <button onclick="addToCart(2, 'Smartphone', 1)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>Headphones</h3>
                <p>Price: ₹3,000</p>
                <button onclick="addToCart(3, 'Headphones', 1)">
                    Add to Cart
                </button>
            </div>

        </div>

        <div id="cart">
            <h2>Cart</h2>
            <p id="cartMessage">Your cart is empty.</p>
        </div>

    </div>

    <script>

        function addToCart(productId, productName, quantity) {

            fetch("/api/cart", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    product_id: productId,
                    name: productName,
                    quantity: quantity
                })
            })
            .then(response => response.json())
            .then(data => {

                document.getElementById("cartMessage").innerText =
                    productName + " added to cart!";

            })
            .catch(error => {

                document.getElementById("cartMessage").innerText =
                    "Unable to add product to cart.";

            });
        }

    </script>

</body>
</html>
